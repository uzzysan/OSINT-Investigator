[package]
name = "vesica-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Pure domain layer: schema registry, property types, normalisation, validation, IDs. No I/O, no internal crate dependencies."

[dependencies]
# vesica-core depends on no other workspace crate and performs no I/O (no
# sqlx, no tokio, no axum, no filesystem, no network) — see AGENT-BRIEF.md and
# 03-architecture.md section 3.3/3.4. Everything below is pure computation over
# values already in memory; `just check-deps` is what catches a regression here.
serde = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
unicode-normalization = { workspace = true }
deunicode = { workspace = true }
phonenumber = { workspace = true }
rphonetic = { workspace = true }
url = { workspace = true }
psl = { workspace = true }
rust_iso3166 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
